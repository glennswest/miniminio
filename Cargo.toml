[package]
name = "miniminio"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Minimal S3-compatible object storage server"
license = "MIT"

[[bin]]
name = "miniminio"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
md-5 = "0.10"
mime_guess = "2"
percent-encoding = "2"
quick-xml = { version = "0.36", features = ["serde", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
